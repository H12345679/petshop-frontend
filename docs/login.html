<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P01 登录页 · 原型</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<div class="page-head">
  <a class="back" href="index.html">← 返回原型总览</a>
  <h1>P01 · 登录页</h1>
  <div class="sub">用户名 / 密码登录，返回 JWT Token ｜ 接口：POST /api/auth/login</div>
</div>

<div class="frame">
  <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">petshop.com/login</span></div>
  <div class="screen">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="logo"><span class="paw">🐾</span>宠物商城</div>
      <div class="spacer"></div>
      <div class="right"><span>首页</span><span>商品</span><span>找门店</span></div>
    </div>

    <!-- 主体：左宣传 + 右登录卡 -->
    <div class="row" style="padding:0;min-height:440px">
      <div class="col img" style="border-radius:0;font-size:14px">品牌宣传插画 / Banner 占位</div>
      <div style="width:420px;flex-shrink:0;padding:40px 36px;border-left:1px solid var(--line)">
        <div class="section-title">欢迎登录</div>
        <div class="muted small mb12">还没有账号？<span style="color:var(--accent)">立即注册 →</span></div>

        <div class="field">
          <label>用户名 / 手机号</label>
          <div class="input"><span class="ph-text">请输入用户名</span></div>
        </div>
        <div class="field">
          <label>密码</label>
          <div class="input"><span class="ph-text">请输入密码</span><span class="spacer"></span><span class="muted small">👁</span></div>
        </div>
        <div class="row between center small mb12">
          <span class="muted">☑ 记住我</span>
          <span style="color:var(--accent)">忘记密码？</span>
        </div>
        <div class="btn primary block lg">登 录</div>

        <div class="row center mt16" style="gap:10px">
          <div class="line f" style="height:1px;background:var(--line)"></div>
          <span class="muted small" style="white-space:nowrap">第三方登录</span>
          <div class="line f" style="height:1px;background:var(--line)"></div>
        </div>
        <div class="row center mt12" style="justify-content:center;gap:20px">
          <div class="avatar">微信</div>
          <div class="avatar">QQ</div>
          <span class="anno">选做 OAuth</span>
        </div>
      </div>
    </div>
    <div class="foot">© 2026 宠物商城 · 程序设计实训</div>
  </div>
</div>

<div class="note"><b>交互：</b>登录成功后将 token 与用户信息写入 Pinia/Vuex 并跳转首页；401 提示「用户名或密码错误」。路由守卫拦截未登录访问受限页面。</div>
</body>
</html>
